defaultUser: guest
app:
  # Image and tag are updated automatically by the CI pipeline in gitops-app.
  image: 477537078556.dkr.ecr.us-east-1.amazonaws.com/gitops-accounts-app
  tag: "a2950f0"
  replicas: 1
  containerPort: 8080
  servicePort: 8080
db:
  image: 477537078556.dkr.ecr.us-east-1.amazonaws.com/gitops-accounts-db
  tag: "a2950f0"
  replicas: 1
  containerPort: 3306
  servicePort: 3306
  storageClass: gp2
  storageSize: 3Gi
memcached:
  image: memcached
  tag: latest
  replicas: 1
  containerPort: 11211
  servicePort: 11211
rabbitmq:
  image: rabbitmq
  tag: latest
  replicas: 1
  containerPort: 5672
  servicePort: 5672
initcontainers:
  image: busybox
ingress:
  enabled: true
  servicePort: 8080
# Passwords are not stored here. Supply them at install time:
#   helm install accounts ./helm/accounts \
#     --set secrets.dbPassword=... --set secrets.rmqPassword=... --set secrets.adminPassword=...
# In the ArgoCD setup they come from a pre-existing Kubernetes secret instead
# (see README).
secrets:
  create: false
  existingSecret: accounts-secret
  dbPassword: ""
  rmqPassword: ""
  adminPassword: ""
dockerregistry:
  enabled: false
  server: ""
  username: ""
  password: ""
  email: ""
