{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
type: Opaque
stringData:
  db-pass: {{ required "secrets.dbPassword is required when secrets.create is true" .Values.secrets.dbPassword | quote }}
  rmq-pass: {{ required "secrets.rmqPassword is required when secrets.create is true" .Values.secrets.rmqPassword | quote }}
  admin-pass: {{ required "secrets.adminPassword is required when secrets.create is true" .Values.secrets.adminPassword | quote }}
{{- end }}
